<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="display" id="display">0</div>
        <div class="buttons-grid">
            <button class="number-btn">1</button>
            <button class="number-btn">2</button>
            <button class="number-btn">3</button>
            <button class="action-btn" id="clear">C</button>
            <button class="action-btn" id="remainder">%</button>

            <button class="number-btn">4</button>
            <button class="number-btn">5</button>
            <button class="number-btn">6</button>
            <button class="action-btn" id="add">+</button>
            <button class="action-btn" id="subtract">-</button>

            <button class="number-btn">7</button>
            <button class="number-btn">8</button>
            <button class="number-btn">9</button>
            <button class="action-btn" id="divide">÷</button>
            <button class="action-btn" id="multiply">x</button>

            <button class="number-btn decimal-btn" id="decimal">.</button>
            <button class="number-btn">0</button>
            <button class="action-btn" id="equals">=</button>
            <button class="action-btn" id="delete">Del</button>
            <button class="action-btn" id="exponent">Exp</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
